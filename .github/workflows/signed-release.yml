name: Signed Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-and-sign:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 11.25.0
          runtime: node@22
          cache: true
          install: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Import signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) {
            throw 'Configure WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD and the WINDOWS_TIMESTAMP_URL repository variable before tagging a release.'
          }

          $encoded = $env:WINDOWS_CERTIFICATE -replace '-----BEGIN [^-]+-----|-----END [^-]+-----|\s', ''
          $pfxPath = Join-Path $env:RUNNER_TEMP 'nexus-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($encoded))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password -ErrorAction Stop |
              Where-Object { $_.HasPrivateKey } |
              Select-Object -First 1
            if (-not $certificate) { throw 'The PFX did not import a code-signing certificate with its private key.' }

            $tauriConfig = @{
              bundle = @{
                windows = @{
                  certificateThumbprint = $certificate.Thumbprint
                  digestAlgorithm = 'sha256'
                  timestampUrl = $env:WINDOWS_TIMESTAMP_URL
                }
              }
            }
            $tauriConfig | ConvertTo-Json -Depth 8 | Set-Content -Path src-tauri/tauri.windows.conf.json -Encoding utf8NoBOM
          }
          finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Build signed Tauri release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: NEXUS ${{ github.ref_name }}
          releaseBody: Signed Windows build of NEXUS V4.2.
          releaseDraft: true
          prerelease: false
